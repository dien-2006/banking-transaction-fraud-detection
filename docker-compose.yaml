name: bank-fraud-detection

x-airflow-common: &airflow-common
  build: {context: ., dockerfile: docker/Dockerfile.airflow}
  image: bank-fraud-airflow:2.10.5-spark3.5.5
  restart: unless-stopped
  env_file: [.env]
  environment: &pipeline-environment
    TZ: ${TZ:-Asia/Ho_Chi_Minh}
    POSTGRES_HOST: postgres-bank
    POSTGRES_INTERNAL_PORT: 5432
    POSTGRES_SCHEMA: banking
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    MINIO_BUCKET_ML: ${MINIO_BUCKET_ML:-ml-models}
    KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
    SOURCE_TIMEZONE: Asia/Ho_Chi_Minh
    PYTHONPATH: /workspace
    ENABLE_REALTIME_SILVER_MERGE: ${ENABLE_REALTIME_SILVER_MERGE:-true}
    SPARK_LOG_LEVEL: WARN
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: 1
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
    AIRFLOW__WEBSERVER__WORKERS: 1
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW_DAGS_PAUSED_AT_CREATION:-false}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow_logs:/opt/airflow/logs
    - ./:/workspace:ro
  networks: [bank-network]
  depends_on:
    postgres-airflow: {condition: service_healthy}

services:
  postgres-bank:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: bank-postgres
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: "${TZ:-Asia/Ho_Chi_Minh}"
      PGTZ: "${TZ:-Asia/Ho_Chi_Minh}"
    command: [postgres, -c, "timezone=${TZ:-Asia/Ho_Chi_Minh}"]
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_bank_data:/var/lib/postgresql/data
      - ./sql:/banking-sql:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/01-banking.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bank-network]

  kafka1: &kafka
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.9.0}
    container_name: bank-kafka1
    hostname: kafka1
    restart: unless-stopped
    ports: ["${KAFKA1_PORT:-9092}:9092"]
    environment: &kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://kafka1:9092,CONTROLLER://kafka1:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:${KAFKA1_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    volumes: [kafka1_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server kafka1:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    profiles: [realtime]
    networks: [bank-network]

  kafka2:
    <<: *kafka
    container_name: bank-kafka2
    hostname: kafka2
    ports: ["${KAFKA2_PORT:-9093}:9093"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://kafka2:9093,CONTROLLER://kafka2:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://localhost:${KAFKA2_PORT:-9093}
    volumes: [kafka2_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server kafka2:29092 >/dev/null 2>&1"]
    profiles: [realtime]

  kafka3:
    <<: *kafka
    container_name: bank-kafka3
    hostname: kafka3
    ports: ["${KAFKA3_PORT:-9094}:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://kafka3:9094,CONTROLLER://kafka3:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://localhost:${KAFKA3_PORT:-9094}
    volumes: [kafka3_data:/var/lib/kafka/data]
    healthcheck:
      test: [CMD-SHELL, "kafka-broker-api-versions --bootstrap-server kafka3:29092 >/dev/null 2>&1"]

  kafka-init:
    image: confluentinc/cp-kafka:${KAFKA_VERSION:-7.9.0}
    restart: "no"
    profiles: [realtime]
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    command: [bash, -ec, "kafka-topics --bootstrap-server kafka1:29092 --create --if-not-exists --topic ${KAFKA_TRANSACTION_TOPIC:-banking.transaction-events.v1} --partitions ${KAFKA_TOPIC_PARTITIONS:-3} --replication-factor ${KAFKA_TOPIC_REPLICATION_FACTOR:-3} --config min.insync.replicas=2 --config retention.ms=${KAFKA_RETENTION_MS:-604800000}"]
    networks: [bank-network]

  kafka-ui:
    image: provectuslabs/kafka-ui:${KAFKA_UI_VERSION:-latest}
    container_name: bank-kafka-ui
    restart: unless-stopped
    profiles: [realtime]
    environment:
      KAFKA_CLUSTERS_0_NAME: bank-fraud-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
    ports: ["${KAFKA_UI_PORT:-8080}:8080"]
    depends_on: [kafka1, kafka2, kafka3]
    networks: [bank-network]

  minio:
    image: minio/minio:${MINIO_VERSION:-RELEASE.2025-09-07T16-13-09Z}
    container_name: bank-minio
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bank-network]

  minio-init:
    image: minio/mc:${MINIO_MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
    restart: "no"
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: [/bin/sh, -c]
    command: ["mc alias set local http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}' && mc mb --ignore-existing local/${MINIO_BUCKET_BRONZE:-bronze} && mc mb --ignore-existing local/${MINIO_BUCKET_SILVER:-silver} && mc mb --ignore-existing local/${MINIO_BUCKET_GOLD:-gold} && mc mb --ignore-existing local/${MINIO_BUCKET_QUARANTINE:-quarantine} && mc mb --ignore-existing local/${MINIO_BUCKET_CONTROL:-pipeline-control} && mc mb --ignore-existing local/${MINIO_BUCKET_ML:-ml-models}"]
    networks: [bank-network]

  spark-master:
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    image: bank-fraud-spark:3.5.5
    container_name: bank-spark-master
    restart: unless-stopped
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master, --host, spark-master, --port, "7077", --webui-port, "8080"]
    ports: ["${SPARK_MASTER_UI_PORT:-8082}:8080"]
    volumes: [./:/workspace:ro]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/json/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bank-network]

  spark-worker:
    build: {context: ., dockerfile: docker/Dockerfile.spark}
    image: bank-fraud-spark:3.5.5
    container_name: bank-spark-worker-1
    restart: unless-stopped
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, spark://spark-master:7077, --cores, "2", --memory, 2g, --webui-port, "8081"]
    depends_on:
      spark-master: {condition: service_healthy}
    volumes: [./:/workspace:ro]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/json/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bank-network]

  postgres-airflow:
    image: postgres:${POSTGRES_VERSION:-17}
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes: [postgres_airflow_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bank-network]

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    command: [bash, -c, "airflow db migrate && (airflow users create --username '${AIRFLOW_ADMIN_USERNAME}' --password '${AIRFLOW_ADMIN_PASSWORD}' --firstname Admin --lastname User --role Admin --email '${AIRFLOW_ADMIN_EMAIL}' || true)"]

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports: ["${AIRFLOW_PORT:-8081}:8080"]
    depends_on:
      postgres-airflow: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
      spark-master: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      postgres-airflow: {condition: service_healthy}
      airflow-init: {condition: service_completed_successfully}
      spark-master: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 20s
      timeout: 10s
      retries: 6

  airflow-batch-bootstrap:
    <<: *airflow-common
    restart: "no"
    command:
      - bash
      - -ec
      - |
        until airflow dags list --output plain | grep -q banking_bronze_silver_gold; do sleep 5; done
        airflow dags unpause banking_bronze_silver_gold
        if airflow dags list-runs -d banking_bronze_silver_gold --output json | grep -q bootstrap_first_run; then
          echo "Initial Batch run already exists"
        else
          airflow dags trigger banking_bronze_silver_gold --run-id bootstrap_first_run
        fi
    depends_on:
      airflow-scheduler: {condition: service_healthy}

  banking-api:
    build: {context: ., dockerfile: docker/Dockerfile.backend}
    image: bank-fraud-backend:node22
    container_name: bank-banking-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres-bank
      POSTGRES_INTERNAL_PORT: 5432
      PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      TRINO_URL: http://trino:8080
      TRINO_USER: ${TRINO_USER:-d4-bank-api}
      REDIS_URL: redis://redis:6379
      OTP_HASH_SECRET: ${OTP_HASH_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      OTP_SENDER_EMAIL: ${OTP_SENDER_EMAIL}
      OTP_SENDER_NAME: ${OTP_SENDER_NAME:-D4 Bank}
      MODEL_CACHE_PATH: /models/current/model.json
      MODEL_DB_NAME: ${MODEL_DB_NAME:-fraud_detection_v1}
      MODEL_DB_MAPPING: ${MODEL_DB_MAPPING:-}
    volumes: [model_cache:/models:ro]
    ports: ["${BANKING_API_PORT:-8000}:8000"]
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8000/api/v1/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres-bank: {condition: service_healthy}
      demo-bootstrap: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [bank-network]

  redis:
    image: redis:${REDIS_VERSION:-7.4-alpine}
    container_name: bank-redis
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, volatile-ttl]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [bank-network]

  demo-bootstrap:
    build: {context: ., dockerfile: docker/Dockerfile.banking}
    image: bank-fraud-banking:3.11
    restart: "no"
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres-bank
      POSTGRES_INTERNAL_PORT: 5432
      POSTGRES_SCHEMA: banking
    command: [python, -m, scripts.bootstrap_demo]
    volumes: [./:/workspace:ro]
    depends_on:
      postgres-bank: {condition: service_healthy}
    networks: [bank-network]

  outbox-publisher:
    build: {context: ., dockerfile: docker/Dockerfile.backend}
    image: bank-fraud-backend:node22
    container_name: bank-outbox-publisher
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres-bank
      POSTGRES_INTERNAL_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      KAFKA_TRANSACTION_TOPIC: ${KAFKA_TRANSACTION_TOPIC:-banking.transaction-events.v1}
    profiles: [realtime]
    command: [node, dist/producer.js]
    depends_on:
      postgres-bank: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
    networks: [bank-network]

  notification-sender:
    build: {context: ., dockerfile: docker/Dockerfile.backend}
    image: bank-fraud-backend:node22
    container_name: bank-notification-sender
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres-bank
      POSTGRES_INTERNAL_PORT: 5432
      BREVO_API_KEY: ${BREVO_API_KEY}
      OTP_SENDER_EMAIL: ${OTP_SENDER_EMAIL}
      OTP_SENDER_NAME: ${OTP_SENDER_NAME:-D4 Bank}
    command: [node, dist/notification-producer.js]
    depends_on:
      postgres-bank: {condition: service_healthy}
    networks: [bank-network]

  bronze-consumer:
    build: {context: ., dockerfile: docker/Dockerfile.streaming}
    image: bank-fraud-streaming:3.11
    container_name: bank-bronze-consumer
    restart: unless-stopped
    profiles: [realtime]
    env_file: [.env]
    environment: {<<: *pipeline-environment}
    command: [python, -m, streaming.consumer.service]
    volumes: [./:/workspace:ro]
    healthcheck:
      test: [CMD, python, -m, streaming.healthcheck, consumer]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    networks: [bank-network]

  model-sync:
    build: {context: ., dockerfile: docker/Dockerfile.streaming}
    image: bank-fraud-streaming:3.11
    container_name: bank-model-sync
    restart: unless-stopped
    env_file: [.env]
    profiles: [ml]
    environment:
      <<: *pipeline-environment
      MODEL_CACHE_PATH: /models/current/model.json
      MODEL_SYNC_INTERVAL_SECONDS: 60
    command: [python, -m, ml.sync]
    volumes:
      - ./:/workspace:ro
      - model_cache:/models
    depends_on:
      minio-init: {condition: service_completed_successfully}
    networks: [bank-network]

  hive-metastore:
    image: apache/hive:${HIVE_VERSION:-4.0.0}
    container_name: bank-hive-metastore
    restart: unless-stopped
    environment:
      SERVICE_NAME: metastore
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    volumes:
      - hive_metastore_data:/opt/hive/data
      - ./docker/hive/conf/core-site.xml:/opt/hive/conf/core-site.xml:ro
    healthcheck:
      test: [CMD-SHELL, "timeout 3 bash -c '</dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [bank-network]

  trino:
    image: trinodb/trino:${TRINO_VERSION:-483}
    container_name: bank-trino
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/trino/etc:/etc/trino:ro
    ports: ["${TRINO_PORT:-8084}:8080"]
    healthcheck:
      test: [CMD, /usr/lib/trino/bin/health-check]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      minio: {condition: service_healthy}
      hive-metastore: {condition: service_healthy}
    networks: [bank-network]

  trino-init:
    build: {context: ., dockerfile: docker/Dockerfile.banking}
    image: bank-fraud-banking:3.11
    restart: "no"
    environment:
      TRINO_URL: http://trino:8080
      GOLD_BUCKET: ${MINIO_BUCKET_GOLD:-gold}
    command: [python, -m, scripts.register_trino]
    volumes: [./:/workspace:ro]
    depends_on:
      trino: {condition: service_healthy}
    networks: [bank-network]

networks:
  bank-network: {name: bank-fraud-network}

volumes:
  postgres_bank_data:
  postgres_airflow_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  minio_data:
  model_cache:
  hive_metastore_data:
  airflow_logs:
  redis_data:
