sources:
  branch: {primary_key: branchid, strategy: SNAPSHOT}
  customer: {primary_key: customerid, strategy: SNAPSHOT}
  customer_device: {primary_key: deviceid, strategy: SNAPSHOT}
  login_event: {primary_key: logineventid, strategy: INCREMENTAL, watermark: [logintime, logineventid]}
  account_type: {primary_key: accounttypeid, strategy: SNAPSHOT}
  bank_account: {primary_key: accountid, strategy: SNAPSHOT}
  account_holder: {primary_key: accountholderid, strategy: SNAPSHOT}
  transaction_type: {primary_key: transactiontypeid, strategy: SNAPSHOT}
  bank_transaction: {primary_key: transactionid, strategy: SNAPSHOT}
  transfer_request: {primary_key: transferrequestid, strategy: SNAPSHOT}
  transaction_posting: {primary_key: postingid, strategy: INCREMENTAL, watermark: [postingdate, postingid]}
  loan_type: {primary_key: loantypeid, strategy: SNAPSHOT}
  loan: {primary_key: loanid, strategy: SNAPSHOT}
  repayment_schedule: {primary_key: scheduleid, strategy: SNAPSHOT}
  loan_payment: {primary_key: loanpaymentid, strategy: INCREMENTAL, watermark: [paymentdate, loanpaymentid]}
  model_version: {primary_key: modelversionid, strategy: SNAPSHOT}
